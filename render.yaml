# Render Blueprint. Create it with: Render Dashboard > New > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: welcome-bot
    runtime: python
    plan: free                  # use "starter" if you attach a disk (see below)
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false             # you type it in the Render dashboard, never in Git
      - key: SYNC_COMMANDS
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false             # from the Turso dashboard (libsql://...)
      - key: TURSO_AUTH_TOKEN
        sync: false             # database token from Turso, keep it secret
      - key: IMAGE_WORKER_URL
        sync: false             # optional: http://host:port of worker.py (e.g. on Wispbyte)
      - key: IMAGE_WORKER_SECRET
        sync: false             # optional: same secret as on the worker
      # With a persistent disk instead of Turso, uncomment:
      # - key: DATA_DIR
      #   value: /var/data
    # Persistent settings need a paid plan + disk. Uncomment and set plan: starter:
    # disk:
    #   name: bot-data
    #   mountPath: /var/data
    #   sizeGB: 1
